name: Claude Code

on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened]

jobs:
  claude:
    # Même précaution que dans local.yml : un commentaire de Claude COMMENCE toujours par "VERDICT:"
    # (voir CLAUDE.md) et peut lui-même mentionner "@claude" en expliquant le mécanisme de dialogue
    # à l'utilisateur. On teste startsWith (pas contains) : un diagnostic auto-posté par local.yml
    # mentionne parfois "VERDICT: IMPLEMENTE" au milieu de son texte (une des remédiations possibles
    # suggérées à Claude) sans être un commentaire de Claude — contains() l'aurait exclu à tort et
    # empêché Claude de jamais analyser cet échec (bug vécu sur l'issue #25).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !startsWith(github.event.comment.body, 'VERDICT:')) ||
      (github.event_name == 'issues' && !contains(github.event.issue.body, '@local go'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: anthropics/claude-code-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          track_progress: true
          # Un run GitHub Actions est ponctuel et sans etat entre les tours : un sous-agent
          # asynchrone ("j'attends sa notification") n'a jamais de suite dans ce contexte,
          # contrairement a une session interactive. On force l'exploration directe et synchrone.
          # Node/npm sont deja presents sur ubuntu-latest, mais l'allowlist d'outils de l'action
          # bloque par defaut les commandes Bash non explicitement autorisees : sans ceci, Claude
          # ne peut pas verifier son propre code (node --check / npm run build) en VERDICT: IMPLEMENTE
          # (constate sur l'issue #25 — Claude a du recommander la verification humaine a la place).
          claude_args: "--disallowedTools Agent --allowedTools 'Bash(node --check:*)' 'Bash(npm install:*)' 'Bash(npm run build:*)'"
          # L'action a son propre déclencheur interne cherchant "@claude" et ignore silencieusement
          # tout événement où ce mot-clé est absent (cas d'une simple ouverture d'issue pour triage).
          # direct_prompt force l'exécution dans ce cas précis, sans affecter le dialogue normal en commentaire.
          prompt: "${{ github.event_name == 'issues' && format('Nouvelle issue #{0} ouverte sans mention @claude explicite. Titre : {1}. Corps : {2}. Applique les consignes de triage de CLAUDE.md sur cette issue precise (numero {0}) : rends un VERDICT, puis agis en consequence.', github.event.issue.number, github.event.issue.title, github.event.issue.body) || '' }}"

      # Le triage est fait par Claude lui-même (voir CLAUDE.md), à chaque invocation — pas
      # seulement à l'ouverture de l'issue : une re-analyse après échec (@claude en commentaire)
      # peut tout aussi bien rendre VERDICT: SIMPLE qu'un premier triage. On regarde donc le tout
      # dernier commentaire de l'issue (forcément celui que Claude vient de poster dans ce job),
      # pas "le dernier commentaire contenant un VERDICT" — sinon un vieux verdict SIMPLE
      # relancerait @local go à tort lors d'un simple échange de dialogue sans nouveau triage.
      # Un commentaire posté avec le GITHUB_TOKEN par défaut ne déclenche pas de nouveau workflow
      # (restriction GitHub anti-boucle), d'où l'usage d'un jeton dédié ici.
      - name: Router vers la voie locale si Claude a jugé la tâche simple
        env:
          GH_TOKEN: ${{ secrets.TRIAGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          LAST_COMMENT=$(gh api "repos/$REPO/issues/${{ github.event.issue.number }}/comments" \
            --paginate --jq '. | last | .body // empty')
          if echo "$LAST_COMMENT" | grep -q "VERDICT: SIMPLE"; then
            echo "Claude a jugé la tâche simple : passage à la voie locale."
            gh issue comment ${{ github.event.issue.number }} --repo "$REPO" --body "@local go"
          else
            echo "Pas de verdict SIMPLE détecté (plan en cours, déjà écrit, ou dialogue sans nouveau triage)."
          fi
