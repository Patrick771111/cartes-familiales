name: Voie locale (qwen)

on:
  issue_comment:
    types: [created]

jobs:
  local:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '@local go')
    runs-on: [self-hosted, local]
    timeout-minutes: 22
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      OLLAMA_API_BASE: http://192.168.4.27:11434
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Créer la branche de travail
        id: branch
        run: |
          git config user.email "patrick.blavier@gmail.com"
          git config user.name "qwen (voie locale)"
          BRANCH="local/issue-${{ github.event.issue.number }}-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Écrire la tâche
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -qxF '.local-task.txt' .gitignore 2>/dev/null; then
            echo '.local-task.txt' >> .gitignore
          fi
          PLAN_FILE="docs/plans/issue-${{ github.event.issue.number }}.md"

          # Le plan peut être sur main, ou encore sur la branche non fusionnée créée par Claude
          PLAN_BRANCH=$(gh api "repos/${{ github.repository }}/branches?per_page=100" --paginate --jq '.[].name' \
            | grep "^claude/issue-${{ github.event.issue.number }}-" | sort | tail -1 || true)

          if [ -f "$PLAN_FILE" ]; then
            echo "Plan trouvé sur main ($PLAN_FILE)."
            cp "$PLAN_FILE" .local-task.txt
            echo "source=plan" >> "$GITHUB_OUTPUT"
          elif [ -n "$PLAN_BRANCH" ] && git fetch origin "$PLAN_BRANCH" --depth 1 2>/dev/null \
               && git show "origin/$PLAN_BRANCH:$PLAN_FILE" > .local-task.txt 2>/dev/null; then
            echo "Plan trouvé sur la branche $PLAN_BRANCH (non fusionnée)."
            echo "source=plan" >> "$GITHUB_OUTPUT"
          elif PLAN_COMMENT=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
                 --paginate --jq '[.[] | select(.body | contains("Plan complet"))] | last | .body // empty') \
               && [ -n "$PLAN_COMMENT" ]; then
            echo "Plan trouvé dans un commentaire (repli après échec de synchronisation Git de la branche du plan)."
            printf '%s\n' "$PLAN_COMMENT" > .local-task.txt
            echo "source=plan" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun plan trouvé : exécution directe de l'issue."
            cat > .local-task.txt << 'TASK_EOF'
          ${{ github.event.issue.title }}

          ${{ github.event.issue.body }}
          TASK_EOF
            echo "source=issue" >> "$GITHUB_OUTPUT"
          fi

          # Le plan (ou la demande directe) peut préciser un modèle autre que le défaut
          # (ex. gemma4:12b pour une tâche nécessitant de lire une image — qwen n'a pas de vision)
          REQUESTED_MODEL=$(grep -oE '^MODELE: .+' .local-task.txt | head -1 | sed 's/^MODELE: //')
          if [ -n "$REQUESTED_MODEL" ]; then
            echo "Modèle demandé explicitement : $REQUESTED_MODEL"
            echo "model=ollama/$REQUESTED_MODEL" >> "$GITHUB_OUTPUT"
          else
            echo "model=ollama/qwen2.5-coder:14b" >> "$GITHUB_OUTPUT"
          fi

      - name: Exécuter qwen via Aider (repli auto si contexte dépassé)
        id: aider
        env:
          PRIMARY_MODEL: ${{ steps.task.outputs.model }}
          FALLBACK_MODEL: ollama/gemma4-64k
        run: |
          run_aider() {
            local model="$1"
            local log_file="$2"
            local container="aider-${{ github.run_id }}-$RANDOM"
            docker run -d --name "$container" \
              -v "$PWD":/app \
              -e OLLAMA_API_BASE="$OLLAMA_API_BASE" \
              paulgauthier/aider \
              --model "$model" \
              --edit-format diff \
              --yes-always \
              --no-auto-lint \
              --no-auto-test \
              --no-check-update \
              --no-show-release-notes \
              --commit-language French \
              --message-file /app/.local-task.txt

            # timeout sur `docker run` seul ne tue pas le conteneur cote daemon :
            # on attend via `docker wait` (tuable proprement) puis on tue le conteneur explicitement au besoin.
            if ! timeout 480 docker wait "$container" > /tmp/aider-exit-code.txt; then
              echo "::warning::$model n'a pas terminé dans les temps (8 min) — arrêt forcé du conteneur."
              docker kill "$container" 2>/dev/null || true
            fi
            docker logs "$container" 2>&1 | tee "$log_file"
            docker rm -f "$container" >/dev/null 2>&1 || true
          }

          echo "Modèle utilisé : $PRIMARY_MODEL"
          run_aider "$PRIMARY_MODEL" /tmp/aider-log-1.txt
          LAST_LOG=/tmp/aider-log-1.txt

          if grep -qE "exceeds the [0-9,]+ token limit" /tmp/aider-log-1.txt && [ "$PRIMARY_MODEL" != "$FALLBACK_MODEL" ]; then
            echo "::warning::Contexte trop grand pour $PRIMARY_MODEL — repli automatique sur $FALLBACK_MODEL (262k tokens de contexte)."
            git checkout -- . 2>/dev/null || true
            run_aider "$FALLBACK_MODEL" /tmp/aider-log-2.txt
            LAST_LOG=/tmp/aider-log-2.txt
            echo "model_used=$FALLBACK_MODEL" >> "$GITHUB_OUTPUT"
          else
            echo "model_used=$PRIMARY_MODEL" >> "$GITHUB_OUTPUT"
          fi

          # Conservés pour le diagnostic si l'exécution échoue (voir step suivant) ; nettoyés seulement à la toute fin du job.
          echo "last_log=$LAST_LOG" >> "$GITHUB_OUTPUT"
          rm -f .local-task.txt

      - name: Vérifier qu'il y a des changements
        id: changes
        run: |
          # Comparer au point de départ réel de la branche, pas à HEAD~1 (faux si aider n'a fait aucun commit :
          # HEAD~1 pointerait alors sur un commit historique de main, donnant un faux positif)
          if git diff --quiet "${{ steps.branch.outputs.base_sha }}" HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier la branche et ouvrir la pull request
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.name }}"
          if [ "${{ steps.task.outputs.source }}" = "plan" ]; then
            ORIGIN_NOTE="Exécute le plan validé dans docs/plans/issue-${{ github.event.issue.number }}.md."
          else
            ORIGIN_NOTE="Exécute directement la demande de l'issue (aucun plan préalable)."
          fi
          if [ "${{ steps.aider.outputs.model_used }}" = "ollama/gemma4-64k" ]; then
            MODEL_NOTE=" (repli automatique sur gemma4-64k, le plan dépassait la fenêtre de qwen)"
          else
            MODEL_NOTE=""
          fi
          gh pr create \
            --title "Voie locale : ${{ github.event.issue.title }}" \
            --body "Résout #${{ github.event.issue.number }}. $ORIGIN_NOTE Produit entièrement par qwen sur le matériel local, sans consommer de quota Claude.$MODEL_NOTE" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.branch.outputs.name }}"

      - name: Demander à Claude d'analyser l'échec et de proposer une remédiation
        if: steps.changes.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.TRIAGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          DIAGNOSTIC=$(tail -c 4000 "${{ steps.aider.outputs.last_log }}" 2>/dev/null || echo "Log indisponible.")
          BODY=$(printf "La voie locale n'a produit aucun changement (modèle utilisé : ${{ steps.aider.outputs.model_used }}).\n\nAnalyse ce diagnostic et propose une remédiation : plan revu et plus ciblé, implémentation directe (VERDICT: IMPLEMENTE) si le blocage est structurel, ou question à l'utilisateur si l'ambiguïté ne peut être levée que par lui.\n\n\`\`\`\n%s\n\`\`\`\n\n@claude" "$DIAGNOSTIC")
          gh issue comment ${{ github.event.issue.number }} --repo "$REPO" --body "$BODY"

      - name: Nettoyer les logs temporaires
        if: always()
        run: rm -f /tmp/aider-log-1.txt /tmp/aider-log-2.txt /tmp/aider-exit-code.txt
