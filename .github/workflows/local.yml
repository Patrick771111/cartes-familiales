name: Voie locale (qwen3.6)

on:
  issue_comment:
    types: [created]

jobs:
  local:
    # Claude écrit lui-même "@local go" en toutes lettres dans ses plans, pour expliquer à
    # l'utilisateur comment valider ("Une fois ce plan validé, un commentaire @local go
    # déclenchera..."). Sans exclusion, cette phrase explicative déclenchait l'exécution
    # toute seule, sans validation réelle. Les commentaires de Claude COMMENCENT toujours
    # par une ligne VERDICT: (voir CLAUDE.md) — d'où startsWith (pas contains) : un diagnostic
    # auto-posté par ce même workflow mentionne parfois "VERDICT: IMPLEMENTE" au milieu de son
    # texte sans être un commentaire de Claude ; contains() l'aurait exclu à tort.
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@local go') &&
      !startsWith(github.event.comment.body, 'VERDICT:')
    runs-on: [self-hosted, local]
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      # Endpoint OpenAI-compatible servi par llama-swap sur le PC gamer.
      # Nom de SERVICE et non de machine : le jour ou l'inference demenage
      # (ou passe derriere un proxy Wake-on-LAN), seul le DNS Pi-hole change.
      LLM_API_BASE: http://llm.lan:8080/v1
      # Un conteneur Docker n'herite pas du resolveur de l'hote : celui-ci vaut
      # 127.0.0.1 (Pi-hole en local), or Docker refuse un resolveur en loopback
      # et bascule sur un DNS public ou les noms .lan n'existent pas. C'est la
      # seule IP qui subsiste, et c'est legitime : on ne resout pas un serveur
      # DNS par un nom.
      LLM_DNS: 192.168.4.31
      GH_TOKEN: ${{ github.token }}
      # L'usine recette, elle ne touche jamais la production. Le schéma est fixé
      # à la construction du bundle : même une requête qui nomme sa table en dur
      # atterrit dans `recette`. Posé au niveau du job et non d'une étape, pour
      # qu'une étape ajoutée plus tard en hérite au lieu de l'oublier.
      # Voir usine-dev/DECISIONS.md §18.
      VITE_SUPABASE_SCHEMA: recette
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Le PC gamer porte l'inférence et peut être éteint. On le réveille si
      # c'est possible, et on échoue vite et lisiblement sinon — plutôt que de
      # laisser l'agent s'épuiser en délais d'attente.
      # Le message posté commence par VERDICT: pour ne déclencher ni Claude ni
      # un nouveau tour de cette voie : une panne d'infra ne se corrige pas en
      # brûlant du quota d'abonnement.
      - name: S'assurer que l'inférence locale répond
        env:
          GAMER_MAC: d8:5e:d3:5c:fd:7d
          WOL_BROADCAST: 192.168.4.255
        run: |
          repond() { curl -s --max-time 5 -o /dev/null "$LLM_API_BASE/models" 2>/dev/null; }

          if repond; then
            echo "Inférence disponible."
            exit 0
          fi

          echo "Inférence injoignable — envoi du paquet magique à $GAMER_MAC."
          python3 - <<'WOL_EOF'
          import os, socket
          mac = os.environ["GAMER_MAC"].replace(":", "").replace("-", "")
          paquet = b"\xff" * 6 + bytes.fromhex(mac) * 16
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_BROADCAST, 1)
          for port in (7, 9):
              s.sendto(paquet, (os.environ["WOL_BROADCAST"], port))
          s.close()
          WOL_EOF

          DEBUT=$(date +%s)
          while [ $(( $(date +%s) - DEBUT )) -lt 180 ]; do
            sleep 5
            if repond; then
              echo "Inférence disponible après $(( $(date +%s) - DEBUT )) s."
              exit 0
            fi
          done

          BODY=$(cat <<'MSG'
          VERDICT: INFRA

          La voie locale n'a pas pu démarrer : le moteur d'inférence du PC gamer n'a pas répondu dans les 180 secondes, malgré un réveil par paquet magique.

          Causes possibles : machine éteinte avec le réveil PCIe désactivé dans le BIOS, llama-swap arrêté, ou lien réseau coupé. Le diagnostic est dans `usine-dev/RUNBOOK.md`.

          Relancer avec `@local go` une fois le gamer disponible.
          MSG
          )
          gh issue comment ${{ github.event.issue.number }} --repo "${{ github.repository }}" --body "$BODY"
          echo "::error::Inférence locale indisponible — voie locale interrompue."
          exit 1

      - name: Créer la branche de travail
        id: branch
        run: |
          git config user.email "patrick.blavier@gmail.com"
          git config user.name "qwen (voie locale)"
          BRANCH="local/issue-${{ github.event.issue.number }}-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Écrire la tâche
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -qxF '.local-task-plan.txt' .gitignore 2>/dev/null; then
            echo '.local-task-plan.txt' >> .gitignore
          fi
          if ! grep -qxF '.local-task.txt' .gitignore 2>/dev/null; then
            echo '.local-task.txt' >> .gitignore
          fi
          PLAN_FILE="docs/plans/issue-${{ github.event.issue.number }}.md"

          # Le plan peut être sur main, ou encore sur la branche non fusionnée créée par Claude
          PLAN_BRANCH=$(gh api "repos/${{ github.repository }}/branches?per_page=100" --paginate --jq '.[].name' \
            | grep "^claude/issue-${{ github.event.issue.number }}-" | sort | tail -1 || true)

          if [ -f "$PLAN_FILE" ]; then
            echo "Plan trouvé sur main ($PLAN_FILE)."
            cp "$PLAN_FILE" .local-task-plan.txt
            echo "source=plan" >> "$GITHUB_OUTPUT"
          elif [ -n "$PLAN_BRANCH" ] && git fetch origin "$PLAN_BRANCH" --depth 1 2>/dev/null \
               && git show "origin/$PLAN_BRANCH:$PLAN_FILE" > .local-task-plan.txt 2>/dev/null; then
            echo "Plan trouvé sur la branche $PLAN_BRANCH (non fusionnée)."
            echo "source=plan" >> "$GITHUB_OUTPUT"
          elif PLAN_COMMENT=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
                 --paginate --jq '[.[] | select(.body | contains("Plan complet"))] | last | .body // empty') \
               && [ -n "$PLAN_COMMENT" ]; then
            echo "Plan trouvé dans un commentaire (repli après échec de synchronisation Git de la branche du plan)."
            printf '%s\n' "$PLAN_COMMENT" > .local-task-plan.txt
            echo "source=plan" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun plan trouvé : exécution directe de l'issue."
            cat > .local-task-plan.txt << 'TASK_EOF'
          ${{ github.event.issue.title }}

          ${{ github.event.issue.body }}
          TASK_EOF
            echo "source=issue" >> "$GITHUB_OUTPUT"
          fi

          # Le plan (ou la demande directe) peut préciser un modèle autre que le défaut
          # (qwen3.6 accepte texte ET image, donc le repli gemma4 pour la vision n'est plus nécessaire)
          REQUESTED_MODEL=$(grep -oE '^MODELE: .+' .local-task-plan.txt | head -1 | sed 's/^MODELE: //')
          if [ -n "$REQUESTED_MODEL" ]; then
            echo "Modèle demandé explicitement : $REQUESTED_MODEL"
            echo "model=openai/$REQUESTED_MODEL" >> "$GITHUB_OUTPUT"
          else
            echo "model=openai/qwen3.6-coder" >> "$GITHUB_OUTPUT"
          fi

      # OpenCode remplace Aider et les ~150 lignes d'orchestration qui
      # l'entouraient. Aider édite en un coup à partir d'une instruction : il
      # fallait donc lui découper le plan fichier par fichier, gérer les
      # débordements de contexte, faire relire chaque étape et annuler celles
      # qui échouaient. OpenCode a sa propre boucle d'agent — il lit les
      # fichiers dont il a besoin, enchaîne ses éditions et s'arrête quand il a
      # fini — donc le plan lui est passé tel quel.
      #
      # Il tourne en conteneur parce qu'avec --auto il dispose d'un shell, et
      # que hubert héberge aussi Pi-hole, Jellyfin et Hermes.
      - name: Exécuter le plan avec OpenCode (modèle local)
        id: agent
        env:
          MODELE: local/qwen3.6-coder
        run: |
          set +e
          # Le plan est transmis avec une consigne explicite. Sans elle, l'agent
          # reçoit un document qui ressemble à une spécification et peut répondre
          # par un autre document : vécu le 19/09/2026, PR #29 — 85 lignes de
          # markdown dans docs/, zéro ligne de code, et la relecture a validé.
          {
            echo "Implémente le plan ci-dessous dans ce dépôt, en modifiant le code source."
            echo "Le plan est déjà décidé et validé par un humain : ne rédige aucun document,"
            echo "ne crée aucun fichier dans docs/, applique-le au code."
            echo "Tu as terminé quand le code correspond au plan."
            echo
            cat .local-task-plan.txt
          } > /tmp/oc-prompt.txt

          # --user : sans lui, l'agent écrit dans le workspace monté avec l'UID root
          # du conteneur, et le runner, qui n'est pas root, ne peut plus faire son
          # checkout au run suivant (« Permission denied » sur dist/). Vécu le
          # 19/09/2026 : 2315 fichiers root laissés derrière lui après qu'il eut
          # lancé le build pour vérifier son propre travail.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --dns "$LLM_DNS" \
            -v "$PWD":/app \
            usine/opencode:1.18.31 \
            run --auto -m "$MODELE" "$(cat /tmp/oc-prompt.txt)" \
            > /tmp/opencode.log 2>&1
          CODE=$?
          set -e

          # Les couleurs ANSI rendent le log illisible une fois recopié dans un
          # commentaire d'issue.
          sed -i 's/\x1b\[[0-9;]*m//g' /tmp/opencode.log
          tail -c 4000 /tmp/opencode.log

          echo "model=$MODELE" >> "$GITHUB_OUTPUT"
          echo "last_log=/tmp/opencode.log" >> "$GITHUB_OUTPUT"

          if [ "$CODE" -ne 0 ]; then
            echo "failed=OpenCode s'est arrêté en erreur (code $CODE)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # OpenCode modifie l'arbre de travail sans commiter. On transforme son
          # travail en un seul commit, ce qui rend la PR lisible : un plan, un
          # commit, au lieu d'un commit par étape comme du temps d'Aider.
          if [ -z "$(git status --porcelain)" ]; then
            echo "failed=OpenCode n'a modifié aucun fichier" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Garde-fou déterministe, parce qu'un relecteur de 12 milliards de
          # paramètres ne l'a pas vu : l'agent a-t-il produit du code, ou
          # seulement des documents comme sur l'issue #28 ?
          #
          # Il testait `git status -- src`, ce qui supposait que les sources
          # vivent dans `src/` à la racine. Faux dès qu'un dépôt les range
          # ailleurs : sur l'issue #3 de pronote-famille, un plan désignant
          # `web/src/` a fait échouer un travail correct — six fichiers et
          # 18 tests qui passaient — parce que `./src` n'existe pas ici.
          # On teste donc l'intention réelle, indépendamment de l'arborescence :
          # au moins un fichier modifié qui ne soit ni du markdown ni sous docs/.
          if [ -z "$(git status --porcelain | awk '{print $NF}' | grep -vE '\.(md|txt)$' | grep -v '^docs/')" ]; then
            echo "failed=OpenCode n'a produit que des documents, pas de code" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -q -m "Voie locale : issue #${{ github.event.issue.number }}"

          # Sauvegarder ici, avant la relecture : jusqu'ici la branche n'était
          # poussée qu'après revue, build, test navigateur et aperçu, donc le
          # moindre accroc en aval condamnait dix minutes de génération. Trois
          # passages ont été régénérés pour cette raison le 20/09/2026.
          #
          # Ce n'est PAS une publication : cette branche porte du code que rien
          # n'a encore validé. Elle est supprimée en fin de run si la chaîne
          # échoue, et ne survit que si une pull request l'adopte — ou si le run
          # est interrompu avant d'avoir pu trancher, ce qui est précisément le
          # cas qu'on veut couvrir.
          git push -q origin "${{ steps.branch.outputs.name }}"
          echo "poussee=true" >> "$GITHUB_OUTPUT"
          echo "failed=" >> "$GITHUB_OUTPUT"

      - name: Vérifier qu'il y a des changements
        id: changes
        run: |
          # Comparer au point de départ réel de la branche, pas à HEAD~1 (faux si l'agent n'a fait aucun commit :
          # HEAD~1 pointerait alors sur un commit historique de main, donnant un faux positif)
          if git diff --quiet "${{ steps.branch.outputs.base_sha }}" HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Revue finale du plan (seconde opinion gemma4)
        id: review
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          CRITERES=$(sed -n '/^## Critères de vérification/,/^## /p' .local-task-plan.txt | sed '$d' | tail -n +2)
          if [ -z "$CRITERES" ]; then
            echo "Pas de critères de vérification explicites dans le plan (tâche simple) — revue finale sautée."
            echo "review_failed=false" >> "$GITHUB_OUTPUT"
          else
            # `gemma4-reviewer` est servi avec 16384 tokens — mesuré le
            # 20/09/2026 : 8000 octets passent, 24000 sont refusés (17107
            # tokens). On coupe donc, mais on réduit d'abord le contexte du
            # diff (-U1 au lieu de 3 par défaut) pour faire tenir plus de code
            # réel dans la même place.
            DIFF_COMPLET=$(git diff -U1 "${{ steps.branch.outputs.base_sha }}" HEAD)
            TAILLE=$(printf '%s' "$DIFF_COMPLET" | wc -c)
            LIMITE=32000
            FULL_DIFF=$(printf '%s' "$DIFF_COMPLET" | head -c "$LIMITE")

            # Le point qui a coûté trois runs : un diff coupé en plein milieu
            # d'un fichier faisait répondre NON au relecteur — à juste titre,
            # puisqu'il lui manquait de quoi juger. Son verdict portait sur
            # notre troncature, pas sur le code. On le lui dit désormais, et on
            # lui demande de juger ce qu'il voit.
            if [ "$TAILLE" -gt "$LIMITE" ]; then
              PREAMBULE="Attention : le diff ci-dessous est un EXTRAIT des $LIMITE premiers octets d'un diff de $TAILLE octets. Il est donc coupe en cours de fichier, et c'est normal. Ne repond pas NON pour cette raison : juge uniquement ce que tu vois, et reponds OUI si rien dans cet extrait ne contredit les criteres."
              echo "::warning::Diff de $TAILLE octets tronqué à $LIMITE pour la revue."
            else
              PREAMBULE="Le diff ci-dessous est complet."
            fi

            PAYLOAD=$(jq -n \
              --arg criteres "$CRITERES" \
              --arg diff "$FULL_DIFF" \
              --arg preambule "$PREAMBULE" \
              '{model: "gemma4-reviewer", max_tokens: 300, messages: [{role: "user", content: ($preambule + "\n\nCriteres de verification attendus :\n" + $criteres + "\n\nDiff produit :\n" + $diff + "\n\nCe diff satisfait-il ces criteres ? Reponds uniquement OUI ou NON sur la premiere ligne, puis une phrase d explication.")}]}')
            RESULT=$(curl -s --max-time 180 "$LLM_API_BASE/chat/completions" -H "Content-Type: application/json" -d "$PAYLOAD" | jq -r '.choices[0].message.content // empty')
            echo "$RESULT" > /tmp/review-log.txt
            cat /tmp/review-log.txt
            if echo "$RESULT" | head -1 | grep -qi "^NON"; then
              echo "review_failed=true" >> "$GITHUB_OUTPUT"
            else
              echo "review_failed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Vérifier la non-régression (syntaxe + build)
        id: verify
        if: steps.changes.outputs.has_changes == 'true' && steps.review.outputs.review_failed != 'true'
        env:
          # Clé "publishable" Supabase : déjà publique (embarquée telle quelle dans le bundle JS
          # du site déployé, protégée uniquement par les policies RLS) — aucune exposition
          # nouvelle à l'écrire dans .env pour que le build/preview de CI puisse s'initialiser
          # normalement (sans elle, l'appli échoue silencieusement au chargement : voir client.js).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/node/bin:$PATH"
          # Tout le bloc qui suit est redirigé vers un fichier qui n'est affiché qu'à la
          # fin. Avec le « -e » que les actions imposent au shell, une commande non
          # gardée qui échoue interrompt donc l'étape AVANT le `cat`, sans laisser la
          # moindre trace : observé le 19/09/2026 sur l'issue #28 — code 243, sortie
          # vide, alors que les mêmes commandes passaient à la main sur le runner.
          # On désactive « -e » ici : les échecs qui nous intéressent sont déjà
          # capturés explicitement par FAILED, et un diagnostic muet coûte une heure.
          set +e
          FAILED=false
          {
            echo "=== Vérification syntaxe des fichiers JS modifiés ==="
            CHANGED_JS=$(git diff --name-only "${{ steps.branch.outputs.base_sha }}" HEAD -- '*.js')
            if [ -n "$CHANGED_JS" ]; then
              for f in $CHANGED_JS; do
                echo "-- node --check $f --"
                node --check "$f" || FAILED=true
              done
            else
              echo "Aucun fichier .js modifié."
            fi

            echo "=== Build (npm run build) ==="
            if [ -f package.json ] && grep -q '"build"' package.json; then
              if [ -n "$VITE_SUPABASE_URL" ] && [ ! -f .env ]; then
                printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\nVITE_SUPABASE_SCHEMA=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" "$VITE_SUPABASE_SCHEMA" > .env
              fi
              npm install --no-audit --no-fund 2>&1 || FAILED=true
              npm run build 2>&1 || FAILED=true
            else
              echo "Pas de script build dans package.json, étape sautée."
            fi
          } > /tmp/verify-log.txt 2>&1
          cat /tmp/verify-log.txt

          if [ "$FAILED" = "true" ]; then
            echo "build_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test de non-régression navigateur (Playwright headless)
        id: browsertest
        if: steps.changes.outputs.has_changes == 'true' && steps.review.outputs.review_failed != 'true' && steps.verify.outputs.build_failed != 'true'
        env:
          # Image officielle Playwright : navigateurs déjà installés (chromium/firefox/webkit),
          # mais pas le paquet npm playwright-core — installé à la volée ci-dessous, en fixant
          # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD pour réutiliser les navigateurs déjà présents dans
          # l'image plutôt que de les re-télécharger. Version du paquet alignée sur le tag d'image.
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.49.1-jammy
          PLAYWRIGHT_CORE_VERSION: "1.49.1"
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/node/bin:$PATH"

          # Test générique (page se charge, contenu visible, pas d'erreur console) : ne connaît
          # rien du contenu métier, c'est un filet de sécurité minimal, pas un test de la
          # fonctionnalité livrée (voir CLAUDE.md, section Analyser un échec).
          #
          # Deux façons de servir le résultat selon le dépôt :
          # - app avec build (Vite...) : package.json déclare un script "preview".
          # - site statique sans build (ex. repas-malin, servi tel quel) : pas de package.json,
          #   juste un index.html — à la racine, ou dans un sous-dossier "repas-malin/" (cas
          #   particulier de ce dépôt précis, voir ARCHITECTURE.md : le HTML déployable n'est
          #   pas à la racine du dépôt Git). Servi via python3 -m http.server, déjà sur hubert.
          SERVE_DIR=""
          if [ -f package.json ] && grep -q '"preview"' package.json; then
            MODE="vite"
          elif [ -f repas-malin/index.html ]; then
            MODE="static"
            SERVE_DIR="repas-malin"
          elif [ -f index.html ]; then
            MODE="static"
            SERVE_DIR="."
          else
            echo "Aucun mécanisme de prévisualisation détecté (ni script npm \"preview\", ni index.html) : test navigateur sauté."
            echo "browser_failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > /tmp/smoke.mjs << 'SMOKE_EOF'
          import { chromium } from 'playwright-core';

          const url = process.argv[2];
          const browser = await chromium.launch();
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', (err) => errors.push('pageerror: ' + err.message));
          page.on('console', (msg) => {
            if (msg.type() === 'error') errors.push('console.error: ' + msg.text());
          });

          let response;
          try {
            response = await page.goto(url, { waitUntil: 'networkidle', timeout: 15000 });
          } catch (e) {
            console.error('NAVIGATION_FAILED: ' + e.message);
            await browser.close();
            process.exit(1);
          }

          if (!response || !response.ok()) {
            console.error('BAD_HTTP_STATUS: ' + (response ? response.status() : 'aucune réponse'));
            await browser.close();
            process.exit(1);
          }

          const bodyText = await page.evaluate(() => document.body.innerText.trim());
          await browser.close();

          let failed = false;
          if (errors.length > 0) {
            console.error('CONSOLE_ERRORS:\n' + errors.join('\n'));
            failed = true;
          }
          if (!bodyText) {
            console.error('EMPTY_BODY: la page ne contient aucun texte visible');
            failed = true;
          }
          if (failed) process.exit(1);
          console.log('OK: page chargée sans erreur, contenu visible présent.');
          process.exit(0);
          SMOKE_EOF

          if [ "$MODE" = "vite" ]; then
            npm run preview -- --port 4173 --strictPort --host 127.0.0.1 > /tmp/preview-server.log 2>&1 &
          else
            (cd "$SERVE_DIR" && python3 -m http.server 4173 --bind 127.0.0.1) > /tmp/preview-server.log 2>&1 &
          fi
          PREVIEW_PID=$!

          READY=false
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173 >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Le serveur de prévisualisation n'a pas démarré à temps."
            cat /tmp/preview-server.log
            kill "$PREVIEW_PID" 2>/dev/null || true
            echo "browser_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          container="smoke-${{ github.run_id }}-$RANDOM"
          docker run -d --name "$container" --network host \
            -v /tmp/smoke.mjs:/smoke.mjs:ro \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            "$PLAYWRIGHT_IMAGE" \
            bash -c "mkdir -p /work && cp /smoke.mjs /work/ && cd /work && npm install --no-audit --no-fund --silent playwright-core@$PLAYWRIGHT_CORE_VERSION && node smoke.mjs http://127.0.0.1:4173"

          if ! timeout 120 docker wait "$container" > /tmp/smoke-exit-code.txt; then
            echo "::warning::Le test navigateur n'a pas terminé dans les temps (2 min) — arrêt forcé."
            docker kill "$container" 2>/dev/null || true
          fi
          docker logs "$container" > /tmp/browsertest-log.txt 2>&1
          cat /tmp/browsertest-log.txt
          SMOKE_EXIT=$(cat /tmp/smoke-exit-code.txt 2>/dev/null || echo 1)
          docker rm -f "$container" >/dev/null 2>&1 || true

          kill "$PREVIEW_PID" 2>/dev/null || true

          if [ "$SMOKE_EXIT" = "0" ]; then
            echo "browser_failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "browser_failed=true" >> "$GITHUB_OUTPUT"
          fi

      # Même mécanisme que dans verification.yml : « versions upload » sert une
      # version sur sa propre adresse sans toucher au trafic de production, et
      # c'est le build déjà vérifié qui part — pas une reconstruction. Les deux
      # voies doivent offrir la même chose à l'arrivée, sinon juger une branche
      # dépendrait de qui l'a écrite. Voir usine-dev/DECISIONS.md §19.
      - name: Publier un aperçu Cloudflare
        id: apercu
        continue-on-error: true
        if: steps.changes.outputs.has_changes == 'true' && steps.review.outputs.review_failed != 'true' && steps.verify.outputs.build_failed != 'true' && steps.browsertest.outputs.browser_failed != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/node/bin:$PATH"
          if [ ! -f wrangler.jsonc ] && [ ! -f wrangler.json ] && [ ! -f wrangler.toml ]; then
            echo "Pas de configuration Wrangler dans ce dépôt : aucun aperçu à publier."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets Cloudflare absents : aperçu non publié."
            exit 0
          fi
          if ! npx --yes wrangler versions upload > /tmp/wrangler-local.log 2>&1; then
            echo "::warning::wrangler n'a pas pu téléverser la version :"
            cat /tmp/wrangler-local.log
            exit 0
          fi
          cat /tmp/wrangler-local.log
          URL=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler-local.log | head -1)
          if [ -z "$URL" ]; then
            echo "::warning::Version téléversée, mais aucune adresse d'aperçu dans la sortie — les Preview URLs sont-elles activées sur le Worker ?"
            exit 0
          fi
          echo "Aperçu : $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Ouvrir la pull request
        if: steps.changes.outputs.has_changes == 'true' && steps.review.outputs.review_failed != 'true' && steps.verify.outputs.build_failed != 'true' && steps.browsertest.outputs.browser_failed != 'true'
        run: |
          # La branche est déjà poussée depuis l'étape de l'agent : c'est la PR
          # qui l'adopte et la rend légitime.
          if [ "${{ steps.task.outputs.source }}" = "plan" ]; then
            ORIGIN_NOTE="Exécute le plan validé dans docs/plans/issue-${{ github.event.issue.number }}.md."
          else
            ORIGIN_NOTE="Exécute directement la demande de l'issue (aucun plan préalable)."
          fi
          if [ -n "${{ steps.agent.outputs.failed }}" ]; then
            FAILED_NOTE=" ⚠️ ${{ steps.agent.outputs.failed }} — voir le commentaire d'analyse sur l'issue."
          else
            FAILED_NOTE=""
          fi
          if [ -n "${{ steps.apercu.outputs.url }}" ]; then
            APERCU_NOTE=$(printf '\n\n**À essayer : %s**\n\nLes données affichées viennent du schéma `recette`, jamais de la production.' "${{ steps.apercu.outputs.url }}")
          else
            APERCU_NOTE=""
          fi
          gh pr create \
            --title "Voie locale : ${{ github.event.issue.title }}" \
            --body "Résout #${{ github.event.issue.number }}. $ORIGIN_NOTE Produit par qwen3.6 via OpenCode sur le matériel local, sans consommer de quota Claude.$FAILED_NOTE$APERCU_NOTE" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.branch.outputs.name }}"

      - name: Demander à Claude d'analyser l'échec et de proposer une remédiation
        if: steps.changes.outputs.has_changes == 'false' || steps.agent.outputs.failed != '' || steps.review.outputs.review_failed == 'true' || steps.verify.outputs.build_failed == 'true' || steps.browsertest.outputs.browser_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRIAGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ steps.verify.outputs.build_failed }}" = "true" ]; then
            PROBLEME="Le code produit ne compile pas (échec de syntaxe ou de build) — voir Vérification de non-régression dans CLAUDE.md."
            DIAGNOSTIC=$(tail -c 4000 /tmp/verify-log.txt 2>/dev/null || echo "Log indisponible.")
          elif [ "${{ steps.review.outputs.review_failed }}" = "true" ]; then
            PROBLEME="Le code produit compile, mais la revue finale (seconde opinion gemma4) juge qu'il ne satisfait pas les critères de vérification du plan."
            DIAGNOSTIC=$(tail -c 4000 /tmp/review-log.txt 2>/dev/null || echo "Log indisponible.")
          elif [ "${{ steps.browsertest.outputs.browser_failed }}" = "true" ]; then
            PROBLEME="Le code compile mais échoue au test de non-régression navigateur (page blanche, erreur console/JS, ou statut HTTP anormal au chargement)."
            DIAGNOSTIC=$(tail -c 4000 /tmp/browsertest-log.txt 2>/dev/null || echo "Log indisponible.")
          else
            PROBLEME="La voie locale a échoué : ${{ steps.agent.outputs.failed }} (modèle : ${{ steps.agent.outputs.model }})."
            DIAGNOSTIC=$(tail -c 4000 "${{ steps.agent.outputs.last_log }}" 2>/dev/null || echo "Log indisponible.")
          fi
          BODY=$(printf "%s\n\nAnalyse ce diagnostic et propose une remédiation : plan revu et plus précis, implémentation directe (VERDICT: IMPLEMENTE) si le blocage est structurel, ou question à l'utilisateur si l'ambiguïté ne peut être levée que par lui.\n\n\`\`\`\n%s\n\`\`\`\n\n@claude" "$PROBLEME" "$DIAGNOSTIC")

          # Un dépôt qui n'a pas de TRIAGE_TOKEN n'a pas de voie Claude : il n'y
          # a alors personne à appeler à l'aide, et tenter de commenter fait
          # échouer l'étape. Le run entier passait au rouge pour cette seule
          # raison, masquant l'état réel du travail (issue #3 de
          # pronote-famille). Le diagnostic va dans le résumé du run, qui se lit
          # sans jeton, et l'étape rend la main proprement.
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Pas de TRIAGE_TOKEN : diagnostic écrit dans le résumé du run plutôt que posté sur l'issue."
            printf '## Échec de la voie locale\n\n%s\n\n```\n%s\n```\n' "$PROBLEME" "$DIAGNOSTIC" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh issue comment ${{ github.event.issue.number }} --repo "$REPO" --body "$BODY"

      # Le pendant de la sauvegarde faite plus haut : une branche poussée que
      # rien n'a validé ne doit pas survivre au run. Soit une pull request
      # l'adopte, soit elle disparaît — sans quoi le dépôt se remplirait de
      # code non relu que personne ne saurait distinguer du reste.
      #
      # Le travail n'est pas perdu pour autant : il reste dans le workspace du
      # runner, sous ~/actions-runner-<dépôt>/_work/, le temps du passage
      # suivant.
      - name: Nettoyer la branche non validée
        if: steps.agent.outputs.poussee == 'true' && (steps.review.outputs.review_failed == 'true' || steps.verify.outputs.build_failed == 'true' || steps.browsertest.outputs.browser_failed == 'true')
        run: |
          echo "::warning::La chaîne n'a pas validé ce travail : la branche ${{ steps.branch.outputs.name }} est supprimée."
          git push -q origin --delete "${{ steps.branch.outputs.name }}" || true

      # Sans cette étape, un passage qui ne publie rien se termine en vert :
      # depuis que l'étape de diagnostic ne plante plus faute de jeton, plus
      # rien ne signalait l'échec, et le run affichait un succès trompeur.
      # C'est précisément ce que DECISIONS.md §16 met en garde : une chaîne qui
      # se termine en vert n'est pas une chaîne qui a produit le bon résultat.
      - name: Échouer si rien n'a été publié
        if: steps.changes.outputs.has_changes == 'false' || steps.agent.outputs.failed != '' || steps.review.outputs.review_failed == 'true' || steps.verify.outputs.build_failed == 'true' || steps.browsertest.outputs.browser_failed == 'true'
        run: |
          echo "::error::La voie locale n'a pas abouti : aucune pull request n'a été ouverte. Voir le diagnostic ci-dessus."
          exit 1

      - name: Nettoyer les logs temporaires
        if: always()
        run: rm -f /tmp/opencode.log /tmp/verify-log.txt /tmp/review-log.txt /tmp/browsertest-log.txt /tmp/smoke.mjs /tmp/smoke-exit-code.txt /tmp/preview-server.log /tmp/wrangler-local.log .local-task-plan.txt
