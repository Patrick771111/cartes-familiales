name: Voie locale (qwen)

on:
  issue_comment:
    types: [created]

jobs:
  local:
    # Claude écrit lui-même "@local go" en toutes lettres dans ses plans, pour expliquer à
    # l'utilisateur comment valider ("Une fois ce plan validé, un commentaire @local go
    # déclenchera..."). Sans le exclusion de VERDICT:, cette phrase explicative déclenchait
    # l'exécution toute seule, sans validation réelle. Les commentaires de Claude commencent
    # toujours par une ligne VERDICT: (voir CLAUDE.md) ; les vraies commandes de validation
    # (humaines ou auto-postées par le routage) n'en contiennent jamais.
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@local go') &&
      !contains(github.event.comment.body, 'VERDICT:')
    runs-on: [self-hosted, local]
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      OLLAMA_API_BASE: http://192.168.4.27:11434
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Créer la branche de travail
        id: branch
        run: |
          git config user.email "patrick.blavier@gmail.com"
          git config user.name "qwen (voie locale)"
          BRANCH="local/issue-${{ github.event.issue.number }}-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Écrire la tâche
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -qxF '.local-task-plan.txt' .gitignore 2>/dev/null; then
            echo '.local-task-plan.txt' >> .gitignore
          fi
          if ! grep -qxF '.local-task.txt' .gitignore 2>/dev/null; then
            echo '.local-task.txt' >> .gitignore
          fi
          PLAN_FILE="docs/plans/issue-${{ github.event.issue.number }}.md"

          # Le plan peut être sur main, ou encore sur la branche non fusionnée créée par Claude
          PLAN_BRANCH=$(gh api "repos/${{ github.repository }}/branches?per_page=100" --paginate --jq '.[].name' \
            | grep "^claude/issue-${{ github.event.issue.number }}-" | sort | tail -1 || true)

          if [ -f "$PLAN_FILE" ]; then
            echo "Plan trouvé sur main ($PLAN_FILE)."
            cp "$PLAN_FILE" .local-task-plan.txt
            echo "source=plan" >> "$GITHUB_OUTPUT"
          elif [ -n "$PLAN_BRANCH" ] && git fetch origin "$PLAN_BRANCH" --depth 1 2>/dev/null \
               && git show "origin/$PLAN_BRANCH:$PLAN_FILE" > .local-task-plan.txt 2>/dev/null; then
            echo "Plan trouvé sur la branche $PLAN_BRANCH (non fusionnée)."
            echo "source=plan" >> "$GITHUB_OUTPUT"
          elif PLAN_COMMENT=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
                 --paginate --jq '[.[] | select(.body | contains("Plan complet"))] | last | .body // empty') \
               && [ -n "$PLAN_COMMENT" ]; then
            echo "Plan trouvé dans un commentaire (repli après échec de synchronisation Git de la branche du plan)."
            printf '%s\n' "$PLAN_COMMENT" > .local-task-plan.txt
            echo "source=plan" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun plan trouvé : exécution directe de l'issue."
            cat > .local-task-plan.txt << 'TASK_EOF'
          ${{ github.event.issue.title }}

          ${{ github.event.issue.body }}
          TASK_EOF
            echo "source=issue" >> "$GITHUB_OUTPUT"
          fi

          # Le plan (ou la demande directe) peut préciser un modèle autre que le défaut
          # (ex. gemma4-64k pour une tâche nécessitant de lire une image — qwen n'a pas de vision)
          REQUESTED_MODEL=$(grep -oE '^MODELE: .+' .local-task-plan.txt | head -1 | sed 's/^MODELE: //')
          if [ -n "$REQUESTED_MODEL" ]; then
            echo "Modèle demandé explicitement : $REQUESTED_MODEL"
            echo "model=ollama/$REQUESTED_MODEL" >> "$GITHUB_OUTPUT"
          else
            echo "model=ollama/qwen2.5-coder:14b" >> "$GITHUB_OUTPUT"
          fi

      - name: Exécuter qwen via Aider (étape par étape, repli auto si contexte dépassé)
        id: aider
        env:
          PRIMARY_MODEL: ${{ steps.task.outputs.model }}
          FALLBACK_MODEL: ollama/gemma4-64k
        run: |
          run_aider() {
            # $1 modèle, $2 argument fichier optionnel ("/app/chemin" ou vide), $3 fichier de log
            local model="$1"
            local file_arg="$2"
            local log_file="$3"
            local container="aider-${{ github.run_id }}-$RANDOM"
            local map_arg=""
            if [ -n "$file_arg" ]; then
              # Fichier cible déjà connu (étape atomique) : pas besoin d'un repo-map, ça économise du contexte.
              map_arg="--map-tokens 0"
            fi
            docker run -d --name "$container" \
              -v "$PWD":/app \
              -e OLLAMA_API_BASE="$OLLAMA_API_BASE" \
              paulgauthier/aider \
              --model "$model" \
              --edit-format diff \
              --yes-always \
              --no-auto-lint \
              --no-auto-test \
              --no-check-update \
              --no-show-release-notes \
              --commit-language French \
              $map_arg \
              --message-file /app/.local-task.txt \
              $file_arg

            # timeout sur `docker run` seul ne tue pas le conteneur cote daemon :
            # on attend via `docker wait` (tuable proprement) puis on tue le conteneur explicitement au besoin.
            if ! timeout 300 docker wait "$container" > /tmp/aider-exit-code.txt; then
              echo "::warning::$model n'a pas terminé dans les temps (5 min) — arrêt forcé du conteneur."
              docker kill "$container" 2>/dev/null || true
            fi
            docker logs "$container" 2>&1 | tee "$log_file"
            docker rm -f "$container" >/dev/null 2>&1 || true
          }

          # Relecture par un second appel qwen, independant de celui qui a code l'etape :
          # qwen ne juge jamais seul son propre travail (evite les faux "succes").
          validate_step() {
            local instruction="$1"
            local diff="$2"
            local diff_trunc
            diff_trunc=$(printf '%s' "$diff" | head -c 6000)
            local payload
            payload=$(jq -n \
              --arg instruction "$instruction" \
              --arg diff "$diff_trunc" \
              '{model: "qwen2.5-coder:14b", prompt: ("Instruction donnee a un developpeur :\n" + $instruction + "\n\nDiff Git produit :\n" + $diff + "\n\nCe diff correspond-il fidelement a l instruction, sans rien ajouter ni oublier d important ? Reponds uniquement OUI ou NON sur la premiere ligne, puis une phrase d explication."), stream: false}')
            local result
            result=$(curl -s --max-time 90 "$OLLAMA_API_BASE/api/generate" -d "$payload" | jq -r '.response // empty')
            {
              echo "--- Relecture qwen de cette étape ---"
              echo "$result"
            } >> /tmp/aider-log-1.txt
            echo "$result" | head -1 | grep -qi "^OUI"
          }

          # Exécute une étape (avec repli automatique gemma4-64k si dépassement de contexte),
          # puis fait relire le résultat par un second appel qwen avant de continuer.
          # Met à jour les variables globales MODEL_USED, LAST_LOG, STEP_FAILED.
          run_step() {
            local instruction="$1"
            local file="$2"
            local step_label="$3"
            printf '%s\n' "$instruction" > .local-task.txt
            local file_arg=""
            if [ -n "$file" ]; then
              file_arg="/app/$file"
            fi
            echo "=== $step_label (fichier: ${file:-non précisé}) ==="
            local step_base_sha
            step_base_sha=$(git rev-parse HEAD)

            run_aider "$PRIMARY_MODEL" "$file_arg" "/tmp/aider-log-1.txt"
            LAST_LOG=/tmp/aider-log-1.txt
            MODEL_USED="$PRIMARY_MODEL"

            if grep -qE "exceeds the [0-9,]+ token limit|Empty response received from LLM" /tmp/aider-log-1.txt \
               && [ "$PRIMARY_MODEL" != "$FALLBACK_MODEL" ]; then
              echo "::warning::$step_label a échoué avec $PRIMARY_MODEL — repli automatique sur $FALLBACK_MODEL."
              git checkout -- . 2>/dev/null || true
              run_aider "$FALLBACK_MODEL" "$file_arg" "/tmp/aider-log-2.txt"
              LAST_LOG=/tmp/aider-log-2.txt
              MODEL_USED="$FALLBACK_MODEL"
            fi

            if grep -qE "exceeds the [0-9,]+ token limit|Empty response received from LLM" "$LAST_LOG"; then
              STEP_FAILED="$step_label"
              echo "::error::$step_label a échoué même après repli."
              return 1
            fi

            if [ "$(git rev-parse HEAD)" = "$step_base_sha" ]; then
              STEP_FAILED="$step_label (aucun commit produit)"
              echo "::error::$step_label n'a produit aucun commit."
              return 1
            fi

            if ! validate_step "$instruction" "$(git diff "$step_base_sha" HEAD)"; then
              STEP_FAILED="$step_label (rejetée à la relecture qwen)"
              echo "::error::$step_label : la relecture juge que le diff ne correspond pas à l'instruction — annulation de cette étape."
              git reset --hard "$step_base_sha"
              return 1
            fi
            return 0
          }

          MODEL_USED="$PRIMARY_MODEL"
          LAST_LOG=""
          STEP_FAILED=""
          STEP_COUNT=0

          # Un plan bien formé décrit chaque étape sous la forme : "N. [chemin/fichier] instruction".
          # Ce découpage garde chaque appel Aider minimal (un seul fichier, pas de repo-map, une
          # instruction courte) — c'est ce qui évite le dépassement de contexte sur les tâches à
          # plusieurs fichiers, plutôt que de compter uniquement sur le repli de modèle après coup.
          # Claude formate parfois le chemin en gras Markdown ("1. **[fichier]** instruction") :
          # tolérer 0 à 2 astérisques autour des crochets, dans la détection comme dans l'extraction.
          if grep -qE '^[0-9]+\.[[:space:]]*\*{0,2}\[.+\]' .local-task-plan.txt; then
            while IFS= read -r line; do
              STEP_COUNT=$((STEP_COUNT+1))
              FILE=$(echo "$line" | grep -oE '\[[^]]+\]' | head -1 | tr -d '[]')
              INSTRUCTION=$(echo "$line" | sed -E 's/^[0-9]+\.[[:space:]]*\*{0,2}\[[^]]+\]\*{0,2}[[:space:]]*//')
              if ! run_step "$INSTRUCTION" "$FILE" "Étape $STEP_COUNT"; then
                break
              fi
            done < <(grep -E '^[0-9]+\.[[:space:]]*\*{0,2}\[.+\]' .local-task-plan.txt)
          else
            echo "Pas d'étapes structurées détectées : exécution en un seul appel (tâche simple)."
            STEP_COUNT=1
            run_step "$(cat .local-task-plan.txt)" "" "Exécution directe" || true
          fi

          echo "model_used=$MODEL_USED" >> "$GITHUB_OUTPUT"
          echo "last_log=$LAST_LOG" >> "$GITHUB_OUTPUT"
          echo "steps_executed=$STEP_COUNT" >> "$GITHUB_OUTPUT"
          echo "step_failed=$STEP_FAILED" >> "$GITHUB_OUTPUT"
          rm -f .local-task.txt
          # .local-task-plan.txt gardé pour la revue finale (étape suivante), nettoyé à la fin du job.

      - name: Vérifier qu'il y a des changements
        id: changes
        run: |
          # Comparer au point de départ réel de la branche, pas à HEAD~1 (faux si aider n'a fait aucun commit :
          # HEAD~1 pointerait alors sur un commit historique de main, donnant un faux positif)
          if git diff --quiet "${{ steps.branch.outputs.base_sha }}" HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Revue finale du plan (seconde opinion qwen)
        id: review
        if: steps.changes.outputs.has_changes == 'true'
        env:
          OLLAMA_API_BASE: http://192.168.4.27:11434
        run: |
          CRITERES=$(sed -n '/^## Critères de vérification/,/^## /p' .local-task-plan.txt | sed '$d' | tail -n +2)
          if [ -z "$CRITERES" ]; then
            echo "Pas de critères de vérification explicites dans le plan (tâche simple) — revue finale sautée."
            echo "review_failed=false" >> "$GITHUB_OUTPUT"
          else
            FULL_DIFF=$(git diff "${{ steps.branch.outputs.base_sha }}" HEAD | head -c 8000)
            PAYLOAD=$(jq -n \
              --arg criteres "$CRITERES" \
              --arg diff "$FULL_DIFF" \
              '{model: "qwen2.5-coder:14b", prompt: ("Criteres de verification attendus :\n" + $criteres + "\n\nDiff complet produit :\n" + $diff + "\n\nCe diff satisfait-il ces criteres ? Reponds uniquement OUI ou NON sur la premiere ligne, puis une phrase d explication."), stream: false}')
            RESULT=$(curl -s --max-time 90 "$OLLAMA_API_BASE/api/generate" -d "$PAYLOAD" | jq -r '.response // empty')
            echo "$RESULT" > /tmp/review-log.txt
            cat /tmp/review-log.txt
            if echo "$RESULT" | head -1 | grep -qi "^NON"; then
              echo "review_failed=true" >> "$GITHUB_OUTPUT"
            else
              echo "review_failed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Vérifier la non-régression (syntaxe + build)
        id: verify
        if: steps.changes.outputs.has_changes == 'true' && steps.review.outputs.review_failed != 'true'
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/node/bin:$PATH"
          FAILED=false
          {
            echo "=== Vérification syntaxe des fichiers JS modifiés ==="
            CHANGED_JS=$(git diff --name-only "${{ steps.branch.outputs.base_sha }}" HEAD -- '*.js')
            if [ -n "$CHANGED_JS" ]; then
              for f in $CHANGED_JS; do
                echo "-- node --check $f --"
                node --check "$f" || FAILED=true
              done
            else
              echo "Aucun fichier .js modifié."
            fi

            echo "=== Build (npm run build) ==="
            if [ -f package.json ] && grep -q '"build"' package.json; then
              npm install --no-audit --no-fund 2>&1
              npm run build 2>&1 || FAILED=true
            else
              echo "Pas de script build dans package.json, étape sautée."
            fi
          } > /tmp/verify-log.txt 2>&1
          cat /tmp/verify-log.txt

          if [ "$FAILED" = "true" ]; then
            echo "build_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier la branche et ouvrir la pull request
        if: steps.changes.outputs.has_changes == 'true' && steps.review.outputs.review_failed != 'true' && steps.verify.outputs.build_failed != 'true'
        run: |
          git push origin "${{ steps.branch.outputs.name }}"
          if [ "${{ steps.task.outputs.source }}" = "plan" ]; then
            ORIGIN_NOTE="Exécute le plan validé dans docs/plans/issue-${{ github.event.issue.number }}.md (${{ steps.aider.outputs.steps_executed }} étape(s))."
          else
            ORIGIN_NOTE="Exécute directement la demande de l'issue (aucun plan préalable)."
          fi
          if [ "${{ steps.aider.outputs.model_used }}" = "ollama/gemma4-64k" ]; then
            MODEL_NOTE=" (repli automatique sur gemma4-64k utilisé sur au moins une étape)"
          else
            MODEL_NOTE=""
          fi
          if [ -n "${{ steps.aider.outputs.step_failed }}" ]; then
            FAILED_NOTE=" ⚠️ ${{ steps.aider.outputs.step_failed }} a échoué et n'a pas été appliquée — voir le commentaire d'analyse sur l'issue."
          else
            FAILED_NOTE=""
          fi
          gh pr create \
            --title "Voie locale : ${{ github.event.issue.title }}" \
            --body "Résout #${{ github.event.issue.number }}. $ORIGIN_NOTE Produit entièrement par qwen sur le matériel local, sans consommer de quota Claude.$MODEL_NOTE$FAILED_NOTE" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.branch.outputs.name }}"

      - name: Demander à Claude d'analyser l'échec et de proposer une remédiation
        if: steps.changes.outputs.has_changes == 'false' || steps.aider.outputs.step_failed != '' || steps.review.outputs.review_failed == 'true' || steps.verify.outputs.build_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRIAGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ steps.verify.outputs.build_failed }}" = "true" ]; then
            PROBLEME="Le code produit ne compile pas (échec de syntaxe ou de build) — voir Vérification de non-régression dans CLAUDE.md."
            DIAGNOSTIC=$(tail -c 4000 /tmp/verify-log.txt 2>/dev/null || echo "Log indisponible.")
          elif [ "${{ steps.review.outputs.review_failed }}" = "true" ]; then
            PROBLEME="Le code produit compile, mais la revue finale (seconde opinion qwen) juge qu'il ne satisfait pas les critères de vérification du plan."
            DIAGNOSTIC=$(tail -c 4000 /tmp/review-log.txt 2>/dev/null || echo "Log indisponible.")
          else
            PROBLEME="La voie locale a rencontré un problème sur « ${{ steps.aider.outputs.step_failed }} » (modèle utilisé : ${{ steps.aider.outputs.model_used }}, ${{ steps.aider.outputs.steps_executed }} étape(s) prévue(s))."
            DIAGNOSTIC=$(tail -c 4000 "${{ steps.aider.outputs.last_log }}" 2>/dev/null || echo "Log indisponible.")
          fi
          BODY=$(printf "%s\n\nAnalyse ce diagnostic et propose une remédiation : plan revu et plus ciblé (étapes encore plus atomiques si besoin), implémentation directe (VERDICT: IMPLEMENTE) si le blocage est structurel, ou question à l'utilisateur si l'ambiguïté ne peut être levée que par lui.\n\n\`\`\`\n%s\n\`\`\`\n\n@claude" "$PROBLEME" "$DIAGNOSTIC")
          gh issue comment ${{ github.event.issue.number }} --repo "$REPO" --body "$BODY"

      - name: Nettoyer les logs temporaires
        if: always()
        run: rm -f /tmp/aider-log-1.txt /tmp/aider-log-2.txt /tmp/aider-exit-code.txt /tmp/verify-log.txt /tmp/review-log.txt .local-task-plan.txt
