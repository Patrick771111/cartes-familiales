name: Triage (qwen)

on:
  issues:
    types: [opened]

jobs:
  triage:
    if: >
      !contains(github.event.issue.body, '@claude') &&
      !contains(github.event.issue.body, '@local go')
    runs-on: [self-hosted, local]
    env:
      OLLAMA_API_BASE: http://192.168.4.27:11434
      MODEL: qwen2.5-coder:14b
    steps:
      - name: Demander un verdict à qwen
        id: triage
        run: |
          cat > .triage-issue.txt << 'ISSUE_EOF'
          ${{ github.event.issue.title }}

          ${{ github.event.issue.body }}
          ISSUE_EOF

          ISSUE_CONTENT=$(cat .triage-issue.txt)
          rm -f .triage-issue.txt

          INSTRUCTIONS="Tu es un trieur de tickets techniques pour un dépôt logiciel. Réponds par un seul mot, en majuscules : SIMPLE ou COMPLEXE.

          SIMPLE = tâche mécanique et bien délimitée : corriger un texte, une valeur de config, une petite fonction évidente, une doc, un test isolé, une dépendance à monter.
          COMPLEXE = nécessite un choix de conception, touche à l'architecture, ambigu, impacte plusieurs fichiers de façon non triviale, ou risque de casser un comportement existant.

          Réponds uniquement par SIMPLE ou COMPLEXE, rien d'autre."

          PAYLOAD=$(jq -n \
            --arg model "$MODEL" \
            --arg instructions "$INSTRUCTIONS" \
            --arg issue "$ISSUE_CONTENT" \
            '{model: $model, prompt: ($instructions + "\n\nTicket :\n" + $issue), stream: false}')

          RESULT=$(curl -s "$OLLAMA_API_BASE/api/generate" -d "$PAYLOAD" | jq -r '.response')
          echo "Réponse qwen : $RESULT"

          if echo "$RESULT" | grep -qi "COMPLEXE"; then
            echo "verdict=complexe" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=simple" >> "$GITHUB_OUTPUT"
          fi

      - name: Poser le label et déclencher la suite
        env:
          GH_TOKEN: ${{ secrets.TRIAGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "triage: complexe" --repo "$REPO" --color "B60205" --force
          gh label create "triage: simple" --repo "$REPO" --color "0E8A16" --force

          if [ "${{ steps.triage.outputs.verdict }}" = "complexe" ]; then
            gh issue edit ${{ github.event.issue.number }} --repo "$REPO" --add-label "triage: complexe"
            gh issue comment ${{ github.event.issue.number }} --repo "$REPO" --body "Triage automatique (qwen, gratuit) : tâche jugée **complexe** — passage par un plan.

          @claude"
          else
            gh issue edit ${{ github.event.issue.number }} --repo "$REPO" --add-label "triage: simple"
            gh issue comment ${{ github.event.issue.number }} --repo "$REPO" --body "Triage automatique (qwen, gratuit) : tâche jugée **simple** — exécution directe.

          @local go"
          fi
